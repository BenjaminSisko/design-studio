function fieldHTML(d,row){const value=row[d.key]??'',key=esc(d.key);let el;if(d.type==='select'){const values=Array.from(new Set([...(d.options||[]),...(value?[value]:[])]));el='<select name="'+key+'">'+values.map(v=>'<option'+(v===value?' selected':'')+'>'+esc(v)+'</option>').join('')+'</select>';}else if(d.type==='ref')el='<select name="'+key+'"'+(d.required?' required':'')+'>'+opts(d.rows,value)+'</select>';else if(d.type==='checks')el='<div class="checks">'+d.rows.map(r=>'<label><input type="checkbox" name="'+key+'" value="'+esc(r.id)+'"'+(Array.isArray(value)&&value.includes(r.id)?' checked':'')+'>'+esc(name(r))+'</label>').join('')+(d.rows.length?'':'<span class="muted">No eligible items yet.</span>')+'</div>';else if(d.type==='textarea')el='<textarea name="'+key+'"'+(d.required?' required':'')+'>'+esc(value)+'</textarea>';else el='<input type="'+d.type+'" name="'+key+'" value="'+esc(value)+'"'+(d.required?' required':'')+(d.min!==undefined?' min="'+d.min+'"':'')+(d.max!==undefined?' max="'+d.max+'"':'')+'>';if(d.type!=='checks')el=el.replace(/<(input|select|textarea) /,'<$1 id="field-'+key+'" ');return '<div class="field '+(d.full?'full':'')+'"><label for="field-'+key+'">'+esc(d.label)+'</label>'+el+(d.hint?'<small>'+esc(d.hint)+'</small>':'')+'</div>';}

async function saveRecord(form){const col=form.dataset.col,id=form.dataset.id,next=clone(model()),row=clone(form._row),data=new FormData(form);for(const d of form._defs){if(d.type==='checks')row[d.key]=data.getAll(d.key);else if(d.type==='number'){const value=data.get(d.key);row[d.key]=value===''?(d.key==='rackU'?null:''):Number(value);}else row[d.key]=String(data.get(d.key)||'').trim();}if(col==='decisions'){row.options=Array.from(form.querySelectorAll('[data-option-id]')).map(el=>{const o={id:el.dataset.optionId};el.querySelectorAll('[data-option-field]').forEach(f=>o[f.dataset.optionField]=f.value.trim());return o;});if(row.status==='Decided'&&(!row.selectedOptionId||!row.rationale))throw Error('A decided outcome needs a selected option and a recorded rationale.');}if(col==='evidence'){const file=$('#evidence-file').files[0];if(file){row.data=await readData(file);row.mime=mimeFor(file);row.createdAt=now();if(!row.name)row.name=file.name;}if(!row.data)throw Error('Choose an attachment.');}if(col==='comments'){row.createdAt=row.createdAt||now();row.resolved=row.resolved||false;}if(col==='meta')next.meta=row;else if(id)next[col][next[col].findIndex(r=>r.id===id)]=row;else next[col].push(row);commit(next,(id?'Updated ':'Added ')+(col==='meta'?'project settings':name(row)));closeModal();if(col==='diagrams'){page='architecture';diagram=row.id;render();}if(inspected)showInspector(inspected,false);}

function readData(file){const mime=mimeFor(file);return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).replace(/^data:[^;]*;/,'data:'+mime+';'));reader.onerror=()=>reject(Error('The attachment could not be read.'));reader.readAsDataURL(file);});}

function printPack(){const m=model(),head=section=>'<div class="print-mark">'+esc(m.meta.classification||'MARKING NOT SET')+'</div><div class="print-head"><div><div class="eyebrow">DESIGN STUDIO / MEETING RECORD</div><h1>'+esc(m.meta.name)+'</h1></div><div>'+esc(section)+'<br>'+esc(date(now()))+' · '+esc(m.meta.phase)+'</div></div>',table=(heads,rows)=>'<table><thead><tr>'+heads.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';let html='<section class="print-page">'+head('Design context & decisions')+'<p>'+esc(m.meta.description)+'</p><h2>Decisions</h2>'+table(['Question','Status / owner','Options / selected','Rationale'],m.decisions.map(d=>[d.title,d.status+' / '+(d.owner||'Unassigned'),d.options.map(o=>(o.id===d.selectedOptionId?'SELECTED: ':'')+o.label).join('\n'),d.rationale||d.context]))+'<p class="print-note">Latest baseline: '+esc(bundle.revisions[0]?.name||'None')+' · Local author labels; entered design information requires team verification.</p></section>';for(const [type,title] of [['network','Network design'],['rack','Rack elevation'],['dependencies','Service dependencies'],...(window.LS?[['logical','Logical service map'],['identity','Identity structure'],['dns','DNS resolution'],['applications','Applications & licensing']]:[])])html+='<section class="print-page">'+head(title)+'<div class="print-diagram">'+draw(type)+'</div><p class="print-note">'+(type==='network'?'Amber: entered connections. Dotted: logical network membership or hosting.':type==='dependencies'?'Arrows point from a service to a service it depends on.':'Positions reflect the recorded lowest occupied U and equipment height.')+'</p></section>';for(const d of m.diagrams)html+='<section class="print-page">'+head(d.name)+'<div class="print-diagram">'+draw(d.id)+'</div><p class="print-note">'+esc(d.notes||'')+'</p></section>';html+='<section class="print-page">'+head('Interfaces, services & verification')+'<h2>Interfaces</h2>'+table(['Interface','Equipment','Network','Address / speed','Lifecycle'],m.interfaces.map(i=>[i.name,ref(i.deviceId),ref(i.networkId),(i.address||'Unassigned')+' / '+(i.speed||'Unspecified'),i.status]))+'<h2>Services</h2>'+table(['Service','Platform / host','Owner','Lifecycle'],m.services.map(s=>[s.name,(s.platform||'Undecided')+' / '+ref(s.deviceId),s.owner||'Unassigned',s.status]))+'<h2>Build work & acceptance criteria</h2>'+table(['Task','Owner / due','Status','Related record'],m.tasks.map(t=>[t.title,(t.owner||'Unassigned')+' / '+(t.due||'No date'),t.status,ref(t.relatedId)]))+'</section>';if(m.comments.length)html+='<section class="print-page">'+head('Discussion')+table(['Context','Author / time','Comment','State'],m.comments.map(c=>[c.entityId==='project'?'Project':ref(c.entityId),c.author+' / '+date(c.createdAt),c.text,c.resolved?'Resolved':'Open']))+'</section>';if(m.evidence.length)html+='<section class="print-page">'+head('Evidence & references')+'<div class="print-evidence">'+m.evidence.map(e=>'<figure>'+(e.mime.startsWith('image/')?'<img src="'+esc(e.data)+'" alt="'+esc(e.name)+'">':'<p>PDF attachment: '+esc(e.name)+'</p>')+'<figcaption><b>'+esc(e.name)+'</b><br>'+esc(e.caption||'')+'<br>'+esc(ref(e.relatedId))+'</figcaption></figure>').join('')+'</div></section>';$('#printpack').innerHTML=html;closeModal();requestAnimationFrame(()=>window.print());}
function llmContext(){const m=clone(model());for(const e of m.evidence)e.data='[embedded attachment omitted from context]';const template={format:'opsdeck-design-changes',version:1,baseProjectId:model().meta.id,baseFingerprint:DS.fingerprint(model()),summary:'Describe the proposed design change',changes:[]};return {format:'opsdeck-design-context',version:1,baseProjectId:template.baseProjectId,baseFingerprint:template.baseFingerprint,recordSchemas:{devices:'id name type owner status networkId rackU height notes [hostedBy]',interfaces:'id name deviceId networkId address mac speed status notes',networks:'id name cidr vlan purpose owner status',services:'id name platform owner status deviceId networkId notes dependsOn[] [kind endpoint protocol port licenseManager redundancy]',links:'id from to label status [fromInterfaceId toInterfaceId]',identity:'id name serviceId implementation domain realm notes status',groups:'id name identityId parentId kind memberIds[] accessIds[] notes status',dnsZones:'id name serviceId kind notes status',dnsRecords:'id name zoneId type value targetId ttl notes status',relationships:'id from to kind label protocol port endpoint notes status',decisions:'id title status owner due context options[{id,label,pros,cons}] selectedOptionId rationale relatedIds[]',tasks:'id title owner status due relatedId',evidence:'id name mime data caption relatedId createdAt',comments:'id entityId author text createdAt resolved',diagrams:'id name nodeIds[] notes [layout:{nodeId:{x,y}}]'},instructions:['Required fields are listed in recordSchemas; square brackets around field names indicate optional fields, suffix [] indicates an array. Use empty strings for unknown text, null for unplaced rackU, positive height, blank ttl or nonnegative integer, and arrays for ID lists.','Identity implementation may be Undecided, Microsoft Active Directory, Red Hat IdM or another entered choice. Directory kind may include groups, roles, Organizational unit or Container. Preserve platform alternatives as decisions.','DNS targetId references a service, device or DNS record (alias); cycles are invalid. Relationships kind is authenticates, resolves, uses-license, hosts, forwards, depends or access. Endpoint, protocol, port and licenseManager are entered facts only.','Return one JSON change set using changeSetTemplate. Do not return JavaScript, Markdown fences, or a replacement project.','Use op upsert with collection and a complete record; op delete with collection and id; or op meta with values. Preserve existing IDs. New records need globally unique IDs.','Allowed collections: '+DS.collections.join(', ')+'. meta.id cannot change.','Copy the baseProjectId and baseFingerprint exactly. They are concurrency guards, not security signatures.','Do not invent addressing, decisions, hosts, approved states, or real equipment facts. Leave unknown fields blank. A Decided decision requires selectedOptionId and rationale.','Device rackU is the LOWEST occupied rack unit, height is positive U. Blank/null rackU is unplaced. Avoid overlap. Interfaces require deviceId. Link interface IDs must belong to its from/to devices.','Evidence binary data is omitted here. Do not modify existing evidence data or add binary attachments in a proposal without using original full project data.','Services dependOn service IDs; decisions options are {id,label,pros,cons}, selectedOptionId references one. Affected records use relatedIds. Diagrams contain nodeIds from devices/networks/services and optional layout {id:{x,y}}.','After proposed edits, the whole model must have valid references. Delete or update affected references when removing a record.'],model:m,changeSetTemplate:template};}
function previewProposal(raw){let proposal=typeof raw==='string'?JSON.parse(raw):raw;const next=DS.applyChanges(model(),proposal),diff=DS.diff(model(),next);pendingProposal={proposal,next,fingerprint:DS.fingerprint(model())};modal('Review proposed design changes','<div class="modal-body"><div class="notice"><b>'+esc(proposal.summary||'Proposed changes')+'</b><br>'+diff.length+' model differences. Review these changes before applying them.</div><div style="max-height:48vh;overflow:auto">'+(diff.map(d=>diffHTML(d,model(),next)).join('')||empty('No model changes','This proposal matches the current draft.'))+'</div><details style="margin-top:15px"><summary>Inspect complete proposed operations</summary><pre style="font:10px var(--mono);white-space:pre-wrap;overflow-wrap:anywhere">'+esc(JSON.stringify(proposal.changes,null,2))+'</pre></details></div>','<button data-action="close-modal">Cancel</button><button data-action="apply-proposal" class="primary"'+(!diff.length?' disabled':'')+'>Apply & record revision</button>');}
function confirmDialog(title,message,action,attrs='',label='Continue'){modal(title,'<div class="modal-body"><p>'+esc(message)+'</p></div>','<button data-action="close-modal">Cancel</button><button data-action="'+action+'" '+attrs+' class="primary">'+esc(label)+'</button>');}
async function handleAction(el){const a=el.dataset.action,id=el.dataset.id,col=el.dataset.col;switch(a){case 'navigate':closeInspector();page=el.dataset.page;filter='';arranging=false;render();break;case 'edit':edit(col,id,{...(el.dataset.device?{deviceId:el.dataset.device}:{}),...(el.dataset.related?{relatedId:el.dataset.related}:{})});break;case 'inspect':if(Date.now()-lastDrag>250&&!arranging)showInspector(id);break;case 'close-inspector':closeInspector();break;case 'close-modal':closeModal();break;case 'settings':edit('meta');break;case 'new-project':newProjectDialog();break;case 'phase':{const next=clone(model());next.meta.phase=el.dataset.phase;commit(next,'Moved project to '+next.meta.phase);break;}case 'presentation':document.body.classList.toggle('presentation');$('#presentation-btn').textContent=document.body.classList.contains('presentation')?'Exit meeting mode':'Meeting mode';break;case 'add':modal('Add to the design','<div class="modal-body"><div class="menu-grid">'+['devices','interfaces','networks','services','links','identity','groups','dnsZones','dnsRecords','relationships','decisions','evidence','tasks','diagrams'].map(c=>'<button data-action="edit" data-col="'+c+'">+ '+labels[c]+'</button>').join('')+'</div></div>');break;case 'logical-view':logicalView=el.dataset.view;diagram=logicalView;render();break;case 'zoom-fit':canvasZoom='fit';render();break;case 'zoom-actual':canvasZoom=1;render();break;case 'diagram':diagram=el.dataset.diagram;arranging=false;render();break;case 'connections':page='links';filter='';render();break;case 'arrange':arranging=!arranging;render();break;case 'auto-layout':{const next=clone(model()),v=next.diagrams.find(d=>d.id===diagram);delete v.layout;commit(next,'Reset diagram layout '+v.name);break;}case 'capture':captureDialog();break;case 'select-revision':selectedRevision=id;render();break;case 'restore':confirmDialog('Restore a design revision','The current draft will be captured as a safety revision, then replaced with the selected model. Existing revision history is retained.','confirm-restore','data-id="'+esc(id)+'"','Capture safety revision & restore');break;case 'confirm-restore':{const r=bundle.revisions.find(r=>r.id===id);revision('Before restore — '+r.name);commit(clone(r.model),'Restored '+r.name);revision('Restored — '+r.name);closeModal();render();toast('Revision restored. The previous draft is preserved.');break;}case 'delete':confirmDialog('Delete this record','Delete '+name(find(id))+'? References from other records must be removed first. The full model will be validated before deletion.','confirm-delete','data-id="'+esc(id)+'" data-col="'+esc(col)+'"','Delete record');break;case 'confirm-delete':{const next=clone(model());next[col]=next[col].filter(r=>r.id!==id);const errors=DS.validate(next);if(errors.length)throw Error('This record is still referenced. Update these relationships first:\n'+errors.slice(0,8).join('\n'));revision('Before deleting '+name(find(id)));commit(next,'Deleted '+name(find(id)));closeModal();closeInspector();break;}case 'resolve':{const next=clone(model()),c=next.comments.find(c=>c.id===id);c.resolved=!c.resolved;commit(next,(c.resolved?'Resolved':'Reopened')+' comment');break;}case 'add-option':{const container=$('#option-editor');container.insertAdjacentHTML('beforeend',optionEditor({id:DS.id('option'),label:'',pros:'',cons:''},container.children.length));break;}case 'remove-option':el.closest('[data-option-id]').remove();break;case 'export':exportsMenu();break;case 'export-json':exportJSON();closeModal();break;case 'export-html':exportHTML();closeModal();break;case 'svg':exportSVG();closeModal();break;case 'print':printPack();break;case 'import-project':$('#project-import').click();break;case 'import-rack':$('#rack-import').click();break;case 'llm-context':download(safeSlug(model().meta.name)+'.llm-context.json',JSON.stringify(llmContext(),null,2));closeModal();toast('LLM context exported. Ask your LLM to return the proposed change-set JSON.');break;case 'preview-proposal':previewProposal($('#llm-proposal').value.trim());break;case 'apply-proposal':{if(!pendingProposal)throw Error('Preview the proposal again.');if(DS.fingerprint(model())!==pendingProposal.fingerprint)throw Error('The draft changed since this preview. Export fresh context and regenerate the proposal.');const p=pendingProposal;revision('Before LLM change — '+p.proposal.summary);commit(p.next,'Applied proposal: '+p.proposal.summary);revision(p.proposal.summary||'LLM proposal applied');closeModal();page='revisions';render();toast('Proposal applied and recorded as a revision.');break;}case 'download-evidence':{const e=model().evidence.find(e=>e.id===id),a=document.createElement('a');a.href=e.data;a.download=e.name+(/\.(png|jpg|jpeg|gif|webp|svg|pdf)$/i.test(e.name)?'':'.'+(e.mime==='application/pdf'?'pdf':e.mime==='image/svg+xml'?'svg':e.mime.split('/')[1]));a.click();break;}}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]')||e.target.closest('#diagram-canvas [data-id]');if(!el)return;if(!el.dataset.action){if(!arranging&&Date.now()-lastDrag>250)showInspector(el.dataset.id);return;}handleAction(el).catch(err=>{const box=$('#form-error');if(box&&$('#modal').open){box.textContent=err.message;box.hidden=false;}else toast(err.message,true);});});
document.addEventListener('input',e=>{if(e.target.id==='table-search'){filter=e.target.value;$('#table-body').innerHTML=tableRows(page);}});
document.addEventListener('change',async e=>{try{if(e.target.id==='logical-focus'){logicalFocus=e.target.value;render();}else if(e.target.id==='project-switch'){if(saveError)exportJSON();const value=storageGet(KEY+e.target.value);if(!value)throw Error('This local project is not available. Open its exported project JSON.');bundle=unpack(JSON.parse(value));localStorage.setItem(ACTIVE,model().meta.id);closeInspector();page='overview';filter='';render();}else if(e.target.id==='proposal-file'){const file=e.target.files[0];if(file){const raw=await file.text();$('#llm-proposal').value=raw;previewProposal(raw);}}else if(e.target.id==='project-import'){const file=e.target.files[0];if(file){const imported=unpack(JSON.parse(await file.text()));if(saveError)exportJSON();else persist();if(imported.model.meta.id===model().meta.id){const saved=clone(model());imported.revisions.unshift({id:DS.id('revision'),name:'Local draft before import',author:saved.meta.author||'Local editor',time:now(),model:saved});}bundle=imported;page='overview';closeInspector();closeModal();persist();render();toast('Opened '+model().meta.name+' with history and attachments.');}e.target.value='';}else if(e.target.id==='rack-import'){const file=e.target.files[0];if(file){const result=DS.rackImport(JSON.parse(await file.text()),model().meta.rackUnits);const next=clone(model());next.devices.push(...result.devices);const errors=DS.validate(next);if(errors.length)throw Error('Rack import needs corrections:\n'+[...result.warnings,...errors].slice(0,12).join('\n'));modal('Review Rack Studio equipment import','<div class="modal-body"><p>'+result.devices.length+' proposed equipment records will be added.</p><div class="notice warn" style="margin-top:14px">'+esc(result.warnings.join('\n')||'Known heights and positions fit the current rack.').replaceAll('\n','<br>')+'</div><p class="inline-note">Review heights carefully. Import does not connect devices or recreate network data.</p></div>','<button data-action="close-modal">Cancel</button><button id="confirm-rack-import" class="primary">Add proposed equipment</button>');$('#confirm-rack-import').onclick=()=>{try{revision('Before Rack Studio import');commit(next,'Imported Rack Studio equipment');closeModal();}catch(error){toast(error.message,true);}};}e.target.value='';}}catch(err){toast(err.message,true);}});
document.addEventListener('submit',async e=>{e.preventDefault();const form=e.target;try{if(form.id==='record-form'){const submit=form.querySelector('[type=submit]');submit.disabled=true;try{await saveRecord(form);}finally{submit.disabled=false;}}else if(form.matches('[data-comment-form]')){const data=new FormData(form),text=String(data.get('text')||'').trim(),author=String(data.get('author')||'').trim();if(!text||!author)throw Error('Enter a comment and author label.');const next=clone(model());next.comments.push({id:DS.id('comment'),entityId:form.dataset.anchor,author,text,createdAt:now(),resolved:false});commit(next,'Added meeting comment');}else if(form.id==='capture-form'){const data=new FormData(form),author=String(data.get('author')||'').trim();if(author!==model().meta.author){const next=clone(model());next.meta.author=author;commit(next,'Updated default author label');}revision(String(data.get('title')).trim());closeModal();render();toast('Named revision captured.');}else if(form.id==='new-project-form'){const data=new FormData(form);if(saveError)exportJSON();else persist();const m=data.get('seed')==='sample'?DS.seed():DS.blank(String(data.get('name')).trim());m.meta.name=String(data.get('name')).trim();bundle={format:'opsdeck-design-studio',version:1,model:m,revisions:[],activity:[],savedAt:now()};revision('Starting design');page='overview';diagram='network';filter='';closeInspector();closeModal();persist();render();toast('New design created.');}}catch(err){const box=$('#form-error');if(box){box.textContent=err.message;box.hidden=false;box.scrollIntoView({block:'nearest'});}else toast(err.message,true);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal').open)closeModal();else closeInspector();}});
window.addEventListener('beforeunload',e=>{if(saveError){e.preventDefault();e.returnValue='Export your project to preserve changes.';}});
window.DesignStudio={getModel:()=>clone(model()),getProject:()=>pack(bundle),validate:()=>DS.validate(model()),draw,loadProject:raw=>{bundle=unpack(raw);persist();render();},previewProposal,exportHTML,exportJSON};
boot();
})();

</script>
