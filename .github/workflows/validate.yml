name: Validate Design Studio

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Set up Node.js for model parity tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify reproducible offline application
        run: python3 tools/build_app.py --check
      - name: Install development-only DOM test dependencies
        run: npm ci --ignore-scripts
      - name: Exercise offline UI controllers and portable exports
        run: npm test
      - name: Run integration and cross-language checks
        run: python3 -m unittest discover -s tests -v
      - name: Validate the fictional example
        run: python3 tools/design_studio.py validate design-studio/sample-model.json
      - name: Check whitespace
        run: git diff --check
